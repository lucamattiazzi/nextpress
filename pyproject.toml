[project]
name = "nextpress"
version = "0.1.0"
description = "nth python framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11.9", "uvicorn>=0.37.0", "watchfiles>=1.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nextpress"]

[dependency-groups]
dev = ["ruff>=0.13.2"]
[tool.ruff]
ignore = ["E731"]
